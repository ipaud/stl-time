name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm dist` passes --publish never: packaging and releasing are separate
      # steps, and the release itself is created below as a draft.
      - name: Build and package
        run: pnpm dist
        env:
          # The build is unsigned; skip electron-builder's signing discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach the dmg to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          draft: true
          body: |
            See the [changelog](https://github.com/ipaud/stl-time/blob/main/CHANGELOG.md)
            for what is in this release.

            **Apple Silicon only.** The build is unsigned, so macOS will refuse
            to open it the first time: right-click the app and choose **Open**,
            then confirm.
