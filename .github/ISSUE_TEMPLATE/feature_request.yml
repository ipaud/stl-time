name: Feature request
description: Suggest something STL Time should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        STL Time answers one question — how long a model takes to print. Things
        that make it a slicer (support painting, object editing, G-code preview)
        are deliberately out of scope. The README lists what is already planned.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
