appId: com.pauavila.stltime
productName: STL Time
copyright: Copyright © 2026 Pau Avila

directories:
  buildResources: build
  output: dist

files:
  - out/**
  # The tray template images are referenced from out/main as ../../resources.
  - resources/**
  - package.json

# GitHub rewrites spaces in asset names, so keep the artifact name space-free.
artifactName: ${name}-${version}-${arch}.${ext}

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  # Unsigned local build: adjust once a Developer ID certificate is available.
  identity: null
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Pau Avila
    LSApplicationCategoryType: public.app-category.utilities

fileAssociations:
  - ext: stl
    name: STL model
    role: Viewer
    rank: Alternate

dmg:
  title: STL Time
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
